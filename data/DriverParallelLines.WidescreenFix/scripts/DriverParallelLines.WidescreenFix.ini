[MAIN]
SkipIntro = 1
FixFMVs = 2 // 0: disabled (FMVs are stretched) | 1: FMVs play at 16:9 ratio if display aspect ratio is 16:9 or more | 2: (default) FMVs always play at 16:9 but can crop if display aspect ratio is less than 16:9
FOVFactor = 1.0
MinResX = 0 // if the game doesn't allow to select desired resolution, make list of resolutions shorter by changing these
MinResY = 0 // to a minimum resolution you'd want to select (e.g. 1920 and 1080 will only display 1080p and above).